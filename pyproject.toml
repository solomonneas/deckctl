[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "deckctl"
version = "0.3.1"
description = "Cross-platform declarative Stream Deck driver: YAML config, hot reload, OBS integration."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Solomon", email = "srneas@gmail.com" }]
requires-python = ">=3.11"
keywords = ["streamdeck", "elgato", "obs", "automation", "macros"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.2",
    "pilmoji>=2.0",
    "streamdeck>=0.9",
    "watchdog>=4.0",
    "obsws-python>=1.6",
    'python-xlib>=0.33 ; sys_platform == "linux"',
    'pywin32>=306 ; sys_platform == "win32"',
    'psutil>=5.9 ; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]
linux = [
    'python-xlib>=0.33 ; sys_platform == "linux"',
]
windows = [
    'pywin32>=306 ; sys_platform == "win32"',
    'psutil>=5.9 ; sys_platform == "win32"',
]

[project.scripts]
deckctl = "deckctl.cli:main"

[project.urls]
Repository = "https://github.com/solomonneas/deckctl"
Issues = "https://github.com/solomonneas/deckctl/issues"
Documentation = "https://github.com/solomonneas/deckctl/tree/main/docs"
Changelog = "https://github.com/solomonneas/deckctl/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/deckctl"]

[tool.hatch.build.targets.wheel.shared-data]
"src/deckctl/assets" = "deckctl/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/deckctl"]

[[tool.mypy.overrides]]
module = ["deckctl.watchers._linux", "deckctl.watchers._windows"]
ignore_missing_imports = true
follow_imports = "skip"
